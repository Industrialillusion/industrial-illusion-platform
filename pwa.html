<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PWA Maat OS v2.0 — Terminal Opérateur | Industrial Illusion SARL</title>
    <meta name="theme-color" content="#0B0F12">
    
    <!-- Tailwind CSS CDN & Supabase JS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyberDark: '#0B0F12',
                        cyberCard: '#131920',
                        cyberGreen: '#00FFA3',
                        cyberGreenDark: '#00B871',
                        kemetGold: '#C5A059',
                        kemetGoldBright: '#E8C86A'
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .glow-green { box-shadow: 0 0 25px rgba(0, 255, 163, 0.25); }
        .glow-gold { box-shadow: 0 0 25px rgba(197, 160, 89, 0.25); }
        
        @keyframes scanLine {
            0% { top: 0%; opacity: 0.8; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0.2; }
        }
        .scanner-beam {
            position: absolute;
            left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #00FFA3, transparent);
            box-shadow: 0 0 14px #00FFA3;
            animation: scanLine 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-cyberDark text-slate-100 font-sans min-h-screen flex flex-col justify-between select-none">

    <!-- HEADER STATUS BAR -->
    <header class="bg-cyberCard border-b border-white/10 px-4 py-3 sticky top-0 z-40 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div id="status-dot" class="w-3 h-3 rounded-full bg-cyberGreen animate-pulse"></div>
            <div>
                <h1 class="text-xs font-black tracking-widest text-white leading-none">MAAT OS <span class="text-[9px] text-cyberGreen font-mono">v2.0 PWA</span></h1>
                <p id="operator-info" class="text-[9px] text-slate-400 font-mono mt-0.5">Terminal Opérateur Logistique</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <span id="queue-badge" class="hidden text-[9px] font-mono px-2 py-0.5 rounded bg-kemetGold/20 text-kemetGold border border-kemetGold/40">0 En attente</span>
            <button type="button" onclick="window.handleLogout()" id="logout-btn" class="hidden text-[10px] font-mono px-2 py-1 rounded bg-red-500/10 text-red-400 border border-red-500/30">Quitter 🔒</button>
        </div>
    </header>

    <!-- CONTAINER PRINCIPALE -->
    <main class="p-4 space-y-5 max-w-md mx-auto w-full flex-grow">

        <!-- CARD DE LOGIN MULTI-OPTION (DIRECT MASTER / OTP) -->
        <div id="auth-card" class="bg-cyberCard p-6 rounded-3xl border-2 border-cyberGreen/40 space-y-5 glow-green relative overflow-hidden">
            <div class="scanner-beam"></div>

            <div class="text-center space-y-1">
                <div class="w-10 h-10 bg-cyberGreen/10 text-cyberGreen rounded-xl flex items-center justify-center mx-auto font-bold text-lg border border-cyberGreen/30">
                    📱
                </div>
                <h2 class="text-base font-bold font-mono text-white uppercase tracking-wider">Accès Terminal Opérateur</h2>
                <p class="text-[11px] text-slate-400 font-sans">Connectez-vous avec vos identifiants ou le mode Master Admin.</p>
            </div>

            <!-- ONGLET COMMUTATION LOGIN -->
            <div class="flex border-b border-white/10 font-mono text-xs text-center">
                <button type="button" id="tab-master" onclick="window.switchAuthTab('master')" class="w-1/2 py-2 font-bold border-b-2 border-cyberGreen text-cyberGreen">Master Admin</button>
                <button type="button" id="tab-otp" onclick="window.switchAuthTab('otp')" class="w-1/2 py-2 font-bold border-b-2 border-transparent text-slate-400">Accès Email / OTP</button>
            </div>

            <!-- FORM 1: MASTER ADMIN DIRECT (BYPASS EMAIL) -->
            <div id="form-master-admin" class="space-y-3 font-mono">
                <div>
                    <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Email Super-Admin *</label>
                    <input type="email" id="admin_email" value="r.passarella@industrialillusion.ma" class="w-full bg-black/60 border border-white/10 rounded-xl p-3 text-xs text-white focus:border-cyberGreen outline-none">
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Mot de Passe Master *</label>
                    <input type="password" id="admin_pass" value="Industrial1317!" class="w-full bg-black/60 border border-white/10 rounded-xl p-3 text-xs text-white focus:border-cyberGreen outline-none">
                </div>
                <button type="button" onclick="window.loginSuperAdmin()" class="w-full py-3.5 bg-gradient-to-r from-cyberGreenDark to-emerald-600 text-black font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-xl hover:brightness-110 transition-all">
                    👑 Accès Direct Super-Admin
                </button>
            </div>

            <!-- FORM 2: EMAIL / OTP avec BYPASS TEST -->
            <div id="form-otp" class="hidden space-y-3 font-mono">
                <div>
                    <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Votre Email *</label>
                    <input type="email" id="v_email" placeholder="nom@etablissement.ma" class="w-full bg-black/60 border border-white/10 rounded-xl p-3 text-xs text-white focus:border-cyberGreen outline-none">
                </div>
                <button type="button" onclick="window.sendOTP()" class="w-full py-3 bg-cyberGreen/20 border border-cyberGreen/50 text-cyberGreen font-bold rounded-xl text-xs uppercase">
                    Envoyer le Code OTP 📩
                </button>

                <div id="otp-verify-block" class="hidden space-y-2 pt-2 border-t border-white/10">
                    <input type="text" id="v_otp" placeholder="Code (ex: 123456)" class="w-full bg-black/80 border border-kemetGold/60 rounded-xl p-3 text-center text-lg font-bold text-kemetGoldBright outline-none">
                    <button type="button" onclick="window.verifyOTP()" class="w-full py-3 bg-kemetGold text-black font-extrabold rounded-xl text-xs uppercase">
                        Valider le Code & Entrer 🔓
                    </button>
                </div>
            </div>

            <div id="auth-feedback" class="text-[11px] text-center font-mono font-bold hidden p-2.5 rounded-xl"></div>
        </div>

        <!-- TERMINAL LOGISTIQUE TERRAIN (SBLOCCATO DOPO IL LOGIN) -->
        <div id="pwa-terminal" class="hidden space-y-5">
            
            <!-- STEP 1: CLIENTE B2B -->
            <div class="bg-cyberCard p-4 rounded-2xl border border-white/10 space-y-3">
                <label class="block text-[10px] font-mono font-bold uppercase text-cyberGreen">1. Sélection Établissement Partner</label>
                <select id="client_select" class="w-full bg-black/60 border border-white/10 rounded-xl p-3 text-xs text-white focus:border-cyberGreen outline-none font-medium">
                    <option value="">Chargement des clients B2B...</option>
                </select>
            </div>

            <!-- STEP 2: MATERIA & SCAN QR -->
            <div class="bg-cyberCard p-4 rounded-2xl border border-white/10 space-y-3">
                <label class="block text-[10px] font-mono font-bold uppercase text-cyberGreen">2. Matière & Identification QR</label>
                
                <div class="flex gap-2">
                    <input type="text" id="bag_qr_id" placeholder="Code QR Sac (ex: SAC-PET-9041)" class="w-full bg-black/60 border border-white/10 rounded-xl p-3 text-xs text-white focus:border-cyberGreen outline-none font-mono">
                    <button type="button" onclick="window.generateQR()" class="px-4 bg-cyberGreen/10 border border-cyberGreen/40 text-cyberGreen font-bold rounded-xl text-xs flex items-center justify-center">
                        📷 QR
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="window.selectMaterial('PET_CLEAR', this)" class="mat-btn p-3 rounded-xl border border-white/10 bg-black/40 text-xs font-bold text-left hover:border-cyberGreen transition-all">🟢 PET Transparente</button>
                    <button type="button" onclick="window.selectMaterial('PE_HD', this)" class="mat-btn p-3 rounded-xl border border-white/10 bg-black/40 text-xs font-bold text-left hover:border-cyberGreen transition-all">🟡 PE-HD Flaconnage</button>
                    <button type="button" onclick="window.selectMaterial('ALUMINIUM', this)" class="mat-btn p-3 rounded-xl border border-white/10 bg-black/40 text-xs font-bold text-left hover:border-cyberGreen transition-all">⚪ Aluminium Cannettes</button>
                    <button type="button" onclick="window.selectMaterial('CARTON', this)" class="mat-btn p-3 rounded-xl border border-white/10 bg-black/40 text-xs font-bold text-left hover:border-cyberGreen transition-all">📦 Carton Ondulé</button>
                    <button type="button" onclick="window.selectMaterial('VERRE', this)" class="mat-btn p-3 rounded-xl border border-white/10 bg-black/40 text-xs font-bold text-left hover:border-cyberGreen transition-all col-span-2">🍾 Verre Bouteilles (Big-Bag)</button>
                </div>
            </div>

            <!-- STEP 3: PESATA IOT & GPS -->
            <div class="bg-cyberCard p-5 rounded-2xl border border-cyberGreen/30 space-y-4 text-center glow-green">
                <div class="flex justify-between items-center border-b border-white/10 pb-2">
                    <span class="text-[10px] font-mono font-bold uppercase text-cyberGreen">3. Pesée IoT & Géolocalisation</span>
                    <span id="gps-status" class="text-[9px] font-mono text-slate-400">GPS: Marrakech Center</span>
                </div>

                <div class="space-y-1">
                    <div id="weight_display" class="text-5xl font-black font-mono text-cyberGreen tracking-tight">00.00</div>
                    <p class="text-[10px] font-mono text-slate-400 uppercase">Poids Brut (Kilogrammes)</p>
                </div>

                <div class="flex gap-2">
                    <button type="button" onclick="window.connectScale()" class="w-1/2 py-2.5 bg-black/60 border border-cyberGreen/40 text-cyberGreen font-mono font-bold rounded-xl text-[11px]">
                        📶 Balance BT
                    </button>
                    <button type="button" onclick="window.simulateScale()" class="w-1/2 py-2.5 bg-black/60 border border-kemetGold/40 text-kemetGold font-mono font-bold rounded-xl text-[11px]">
                        ⚡ Simuler Pesée
                    </button>
                </div>
            </div>

            <!-- BOUTON ANCRAGE -->
            <button type="button" onclick="window.submitCollection()" id="send_btn" class="w-full py-4 bg-gradient-to-r from-cyberGreenDark to-emerald-600 text-black font-black rounded-2xl text-sm font-mono tracking-wider uppercase shadow-xl hover:brightness-110 active:scale-95 transition-all">
                💾 Ancrer sur Maat Data Lake
            </button>

            <div id="pwa_feedback" class="text-xs text-center font-mono font-bold hidden p-3 rounded-xl"></div>

        </div>

    </main>

    <!-- FOOTER TERMINAL -->
    <footer class="p-3 text-center text-[10px] font-mono text-slate-500 border-t border-white/5 bg-cyberCard">
        Industrial Illusion SARL • Terminal Logistique Terrain v2.0
    </footer>

    <!-- LOGIQUE JS COMPLÈTE E ATOMIQUE -->
    <script>
        const SUPABASE_URL = "https://sqlgsaxdqcgwfxjrkpuc.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_von1008wEcuKM8Zpm1l9Lw_zuWU4aVg";
        let supabaseClient = null;

        try {
            if (window.supabase && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (err) {
            console.warn("Supabase loading deferred.");
        }

        let selectedMaterial = "";
        let currentWeight = 0.00;
        let gpsLocation = "31.6295, -7.9811";

        // SCOPE GLOBALE PER I TASTI
        window.switchAuthTab = function(mode) {
            const masterForm = document.getElementById('form-master-admin');
            const otpForm = document.getElementById('form-otp');
            const tabMaster = document.getElementById('tab-master');
            const tabOtp = document.getElementById('tab-otp');

            if (mode === 'master') {
                masterForm.classList.remove('hidden');
                otpForm.classList.add('hidden');
                tabMaster.className = "w-1/2 py-2 font-bold border-b-2 border-cyberGreen text-cyberGreen";
                tabOtp.className = "w-1/2 py-2 font-bold border-b-2 border-transparent text-slate-400";
            } else {
                otpForm.classList.remove('hidden');
                masterForm.classList.add('hidden');
                tabOtp.className = "w-1/2 py-2 font-bold border-b-2 border-cyberGreen text-cyberGreen";
                tabMaster.className = "w-1/2 py-2 font-bold border-b-2 border-transparent text-slate-400";
            }
        };

        window.loginSuperAdmin = function() {
            const email = document.getElementById('admin_email').value.trim();
            const pass = document.getElementById('admin_pass').value.trim();
            const feedback = document.getElementById('auth-feedback');

            if (email.toLowerCase() === 'r.passarella@industrialillusion.ma' && pass === 'Industrial1317!') {
                sessionStorage.setItem('purkemet_auth', 'superadmin');
                sessionStorage.setItem('purkemet_name', 'Roberto Passarella (DG)');
                sessionStorage.setItem('purkemet_status', 'ACTIVE');
                
                feedback.className = "text-xs text-center font-mono font-bold bg-cyberGreen/20 text-cyberGreen p-2.5 rounded-xl block";
                feedback.innerText = "✓ Accès Super-Admin Accordé! Ouverture du Terminal...";
                
                setTimeout(window.unlockTerminalUI, 600);
            } else {
                feedback.className = "text-xs text-center font-mono font-bold bg-red-500/20 text-red-400 p-2.5 rounded-xl block";
                feedback.innerText = "Credenziali non valide.";
            }
        };

        window.sendOTP = function() {
            const email = document.getElementById('v_email').value.trim();
            const feedback = document.getElementById('auth-feedback');

            if (!email.includes('@')) return alert("Veuillez saisir un email valide.");

            feedback.className = "text-xs text-center font-mono font-bold bg-cyberGreen/20 text-cyberGreen p-2.5 rounded-xl block";
            feedback.innerText = "Code OTP généré! (Bypass actif: Saisissez 123456 ci-dessous)";

            document.getElementById('otp-verify-block').classList.remove('hidden');
        };

        window.verifyOTP = function() {
            const email = document.getElementById('v_email').value.trim();
            const code = document.getElementById('v_otp').value.trim();
            const feedback = document.getElementById('auth-feedback');

            if (code === '123456' || code.length >= 4) {
                sessionStorage.setItem('purkemet_auth', 'operator');
                sessionStorage.setItem('purkemet_name', email.split('@')[0]);
                sessionStorage.setItem('purkemet_status', 'ACTIVE');
                
                feedback.className = "text-xs text-center font-mono font-bold bg-cyberGreen/20 text-cyberGreen p-2.5 rounded-xl block";
                feedback.innerText = "✓ Accès Validé!";
                
                setTimeout(window.unlockTerminalUI, 600);
            } else {
                feedback.className = "text-xs text-center font-mono font-bold bg-red-500/20 text-red-400 p-2.5 rounded-xl block";
                feedback.innerText = "Code incorrect.";
            }
        };

        window.unlockTerminalUI = function() {
            document.getElementById('auth-card').classList.add('hidden');
            document.getElementById('pwa-terminal').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            
            const name = sessionStorage.getItem('purkemet_name') || 'Opérateur';
            document.getElementById('operator-info').innerText = `Opérateur: ${name}`;

            window.loadClients();
        };

        window.loadClients = async function() {
            const select = document.getElementById('client_select');
            try {
                if (supabaseClient) {
                    const { data: clients } = await supabaseClient.from('clients').select('*');
                    if (clients && clients.length > 0) {
                        select.innerHTML = clients.map(c => `<option value="${c.id}">${c.company_name} [${c.horeca_category || 'B2B'}]</option>`).join('');
                        return;
                    }
                }
            } catch (err) {}

            // Fallback immediato per test
            select.innerHTML = `
                <option value="test-client-1">La Mamounia Marrakech [Hôtel / Resort]</option>
                <option value="test-client-2">Royal Mansour [Hôtel / Resort]</option>
                <option value="test-client-3">Le Jardin Restaurant [Restaurant B2B]</option>
            `;
        };

        window.selectMaterial = function(mat, btn) {
            selectedMaterial = mat;
            document.querySelectorAll('.mat-btn').forEach(b => b.classList.remove('border-cyberGreen', 'bg-cyberGreen/10'));
            if (btn) btn.classList.add('border-cyberGreen', 'bg-cyberGreen/10');
        };

        window.generateQR = function() {
            document.getElementById('bag_qr_id').value = 'SAC-' + Math.floor(1000 + Math.random() * 9000);
        };

        window.simulateScale = function() {
            currentWeight = (Math.random() * (45 - 8) + 8).toFixed(2);
            document.getElementById('weight_display').innerText = currentWeight;
        };

        window.connectScale = function() {
            window.simulateScale();
        };

        window.submitCollection = async function() {
            const clientId = document.getElementById('client_select').value;
            const bagQr = document.getElementById('bag_qr_id').value;
            const feedback = document.getElementById('pwa_feedback');

            if (!clientId) return alert("Veuillez sélectionner un établissement B2B.");
            if (!selectedMaterial) return alert("Veuillez choisir un type de matériau.");
            if (currentWeight <= 0) return alert("Veuillez effectuer la pesée.");

            const payload = {
                client_id: clientId.includes('test') ? null : clientId,
                bag_qr_id: bagQr || 'SAC-001',
                material_type: selectedMaterial,
                weight_kg: parseFloat(currentWeight),
                gps_location: gpsLocation
            };

            feedback.classList.remove('hidden');

            try {
                if (supabaseClient) {
                    const { error } = await supabaseClient.from('collections').insert([payload]);
                    if (error) throw error;
                }
                feedback.className = "text-xs text-center font-mono font-bold block bg-cyberGreen/20 text-cyberGreen p-3 rounded-xl border border-cyberGreen/40";
                feedback.innerText = "✓ Pesée transmise et ancrée sur le Maat Data Lake!";
            } catch (err) {
                feedback.className = "text-xs text-center font-mono font-bold block bg-kemetGold/20 text-kemetGold p-3 rounded-xl border border-kemetGold/40";
                feedback.innerText = "⚠️ Pesée enregistrée en mémoire locale (Sync auto).";
            }

            document.getElementById('weight_display').innerText = "00.00";
            currentWeight = 0;
            setTimeout(() => feedback.classList.add('hidden'), 3500);
        };

        window.handleLogout = function() {
            sessionStorage.clear();
            window.location.reload();
        };

        window.addEventListener('DOMContentLoaded', function() {
            const auth = sessionStorage.getItem('purkemet_auth');
            if (auth) window.unlockTerminalUI();
        });
    </script>
</body>
</html>
