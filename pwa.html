<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maat OS v8.1 — Workstation Opérateur | Industrial Illusion SARL</title>
<meta name="description" content="Maat OS : tournée, double pesée certifiée, contrats ambassadeurs et Kemet Wallet pour les opérateurs du Projet PurKemet.">
<meta name="theme-color" content="#00FFA3">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maat OS">
<!-- CHANGED : manifest dédié à la Workstation (scope /pwa.html) -->
<link rel="manifest" href="pwa.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/maat.css">
<!-- ADDED : Badge phygital module styles -->
<link rel="stylesheet" href="assets/pwa-badges.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="assets/tw-config.js"></script>
<script src="assets/config.js"></script>
<!-- Suppression de 'defer' pour garantir le chargement avant le kernel -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<!-- ADDED : Maat unified QR infrastructure (disponibles pour pwa.js) -->
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="assets/qr-generator.js" defer></script>
<script src="assets/qr-scanner.js" defer></script>
<!-- ADDED : Badge phygital module (Mon Badge + CR-80 + upload foto) -->
<script src="assets/pwa-badges.js" defer></script>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden" style="background:#090D10">

<header class="bg-obsidianCard/95 backdrop-blur border-b border-white/10 sticky top-0 z-40 shadow-lg" style="padding-top:env(safe-area-inset-top)">
  <div class="px-4 py-3 flex justify-between items-center gap-2 max-w-md mx-auto">
    <div class="flex items-center gap-2.5 min-w-0">
      <svg class="w-9 h-9 shrink-0" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <path d="M10 50Q50 15 90 50Q50 85 10 50Z" stroke="#00FFA3" stroke-width="4"/>
        <circle cx="50" cy="50" r="16" stroke="#C5A059" stroke-width="3.5" fill="#0A0D10"/>
        <circle cx="50" cy="50" r="6" fill="#00FFA3"/>
        <path d="M50 34V22M34 50H20M66 50H80M50 66v10" stroke="#00FFA3" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="min-w-0">
        <h1 class="font-kemetTitle text-sm font-black tracking-widest leading-none">MAAT OS <span class="font-mono text-[9px] text-cyberGreen">v8.1</span></h1>
        <p id="opInfo" class="text-[9px] text-slate-400 font-mono mt-0.5 truncate">Workstation opérateur</p>
      </div>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button type="button" id="modeBtn" class="hidden text-[10px] font-mono px-2 py-1 rounded bg-kemetGold/20 text-kemetGoldBright border border-kemetGold/40 font-bold"></button>
      <span id="gpsChip" class="hidden text-[9px] font-mono text-slate-400">GPS…</span>
      <span id="qBadge" class="hidden text-[9px] font-mono px-2 py-0.5 rounded bg-kemetGold/20 text-kemetGold border border-kemetGold/40">0</span>
      <span id="netDot" class="dot" role="status" aria-label="État de la connexion réseau" title="Connexion"></span>
    </div>
  </div>
</header>

<main id="app" class="p-4 space-y-4 max-w-md mx-auto w-full flex-grow pb-28"></main>
<nav id="bnav" class="bnav hidden" aria-label="Navigation principale"></nav>
<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- Overlay succès -->
<div id="okOverlay" role="status"><div class="text-center space-y-3">
  <svg width="96" height="96" viewBox="0 0 96 96" fill="none" aria-hidden="true">
    <circle cx="48" cy="48" r="44" stroke="#00FFA3" stroke-width="3"/>
    <path d="M28 50l14 14 26-30" stroke="#00FFA3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <p id="okTxt" class="font-mono font-bold text-cyberGreen text-sm px-6"></p>
</div></div>

<!-- Bandeau installation PWA -->
<div id="installBar" role="banner">
  <span style="font-size:1.5rem" aria-hidden="true">📲</span>
  <div style="flex:1">
    <div style="font-weight:800;color:#fff">Installer Maat OS</div>
    <div style="color:#94a3b8;font-size:.62rem;margin-top:2px">Accès plein écran, hors-ligne, notifications.</div>
  </div>
  <button type="button" class="primary" id="installGo">Installer</button>
  <button type="button" style="color:#94a3b8;font-size:1.2rem" id="installNo" aria-label="Refuser">×</button>
</div>

<!-- Indicateur pull-to-refresh -->
<div id="ptr" class="ptr" aria-hidden="true">Actualisation…</div>

<noscript>
  <div style="padding:2rem;text-align:center;font-family:monospace;color:#f87171">
    Maat OS nécessite JavaScript activé pour fonctionner.
  </div>
</noscript>

<script src="assets/core.js"></script>
<script src="assets/pwa.js"></script>
<script src="assets/monitoring.js"></script>

<!-- ADDED : Service Worker registration (idempotent, safe even if pwa.js also registers it) -->
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .then(function (reg) {
        console.log('[MaatOS] SW registered · scope:', reg.scope);
      })
      .catch(function (err) {
        console.warn('[MaatOS] SW registration failed:', err);
      });
  });
})();
</script>

</body>
</html>
