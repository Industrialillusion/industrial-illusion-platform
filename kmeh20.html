  <style>
    html {
      background-color: #060A0D !important;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;

    body {
      background-color: transparent !important;
      background-image: none !important;
      color: #F1F5F9 !important;
      font-family: 'Plus Jakarta Sans', sans-serif;

    #spaceCanvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 0 !important;
      pointer-events: none !important;
      display: block !important;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);

    #kmehAmbientLayer {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0, 255, 163, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(232, 200, 106, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(197, 160, 89, 0.05) 0%, transparent 50%);
      animation: ambientDrift 40s ease-in-out infinite alternate;
    }
    @keyframes ambientDrift {

      100% { transform: translate(-2%, -1%) scale(1.05); }

    main, footer { position: relative; z-index: 10; }
    header { z-index: 50; }

    input, select, textarea, .inp { font-size: 16px !important; }
    @media (min-width: 640px) {
      input, select, textarea, .inp { font-size: 0.8rem !important; }
    }

    .btn, button, .step-tab, .level-card { min-height: 44px; min-width: 44px; }

    .cta-inline {
      width: auto !important; max-width: 100%;
      display: inline-flex !important; align-items: center; justify-content: center;
      gap: 0.4rem; white-space: nowrap; min-height: 44px;
    }
    .cta-inline:hover { transform: translateY(-1px); }

    #scrollProgress {
      position: fixed; top: 0; left: 0;
      height: 3px; width: 0%;
      background: linear-gradient(90deg, #00B871, #00FFA3, #E8C86A, #C5A059);
      z-index: 9999;

      transition: width .1s ease-out;
      pointer-events: none;
    }

    .reveal {
      opacity: 0; transform: translateY(35px);
      transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1);
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    .tilt-card { transform-style: preserve-3d; transition: transform .3s ease-out, box-shadow .3s; will-change: transform; }
    .tilt-card:hover { box-shadow: 0 25px 50px -15px rgba(0, 255, 163, .3); }

    .animated-divider {
      height: 1px;

      animation: dividerPulse 3s ease-in-out infinite;
      margin: 2.5rem auto; max-width: 60%;

    @keyframes dividerPulse { 0%, 100% { opacity: .3; transform: scaleX(.7); } 50% { opacity: 1; transform: scaleX(1); } }

    .glass-panel {
      background: linear-gradient(165deg, rgba(19, 25, 32, 0.88), rgba(9, 13, 16, 0.96)) !important;
      border: 1px solid rgba(197, 160, 89, 0.35) !important;
      border-radius: 1.25rem !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.8) !important;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (min-width: 640px) { .glass-panel { border-radius: 1.5rem !important; } }
    .glass-panel.g { border-color: rgba(0, 255, 163, 0.45) !important; box-shadow: 0 0 35px -8px rgba(0, 255, 163, 0.18) !important; }
    .glass-panel:hover { transform: translateY(-3px); border-color: rgba(0, 255, 163, 0.6) !important; }

    .inp {
      width: 100%;

      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      border-radius: 0.75rem !important;
      padding: 0.75rem !important;
      color: #fff !important; outline: none; transition: border-color .2s;
    }
    .inp:focus { border-color: #00FFA3 !important; box-shadow: 0 0 0 3px rgba(0,255,163,.12); }

    .btn {
      padding: 0.85rem; border-radius: 0.8rem;
      font: 800 0.72rem 'JetBrains Mono', monospace;
      letter-spacing: 0.06em; text-transform: uppercase;
      transition: all 0.2s;
      display: inline-flex; align-items: center; justify-content: center;
      text-align: center; cursor: pointer; border: none;
    }
    .btn-g { background: linear-gradient(135deg, #00B871, #059669) !important; color: #000 !important; }
    .btn-g:hover { filter: brightness(1.1); box-shadow: 0 0 25px rgba(0, 255, 163, 0.35); }
    .btn-au { background: linear-gradient(135deg, #E8C86A, #C5A059) !important; color: #1a1405 !important; }
    .btn-au:hover { filter: brightness(1.1); box-shadow: 0 0 25px rgba(197, 160, 89, 0.3); }
    .btn-o { background: rgba(0, 0, 0, 0.8) !important; border: 1px solid rgba(0, 255, 163, 0.5) !important; color: #00FFA3 !important; }
    .btn-o:hover { border-color: #00FFA3 !important; }
    .btn-o.is-active { background: rgba(0, 255, 163, 0.15) !important; border-color: #00FFA3 !important; box-shadow: 0 0 18px -3px rgba(0, 255, 163, 0.5); }

    @keyframes orbitSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes orbitRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pupilPulse { 0%, 100% { r: 6.8; opacity: 1; } 50% { r: 8.6; opacity: .82; } }
    .anim-orbit { animation: orbitSpin 16s linear infinite; transform-origin: 60px 60px; }
    .anim-counter-orbit { animation: orbitRev 11s linear infinite; transform-origin: 60px 60px; }
    .anim-pupil { animation: pupilPulse 2.4s ease-in-out infinite; }

    .scanner-beam {
      position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, #00FFA3, transparent);
      box-shadow: 0 0 14px #00FFA3;
      animation: scanLine 3.8s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes scanLine { 0% { top: 0%; opacity: .85; } 50% { opacity: 1; } 100% { top: 100%; opacity: .2; } }

    /* ============================================================
       HERO K-MEH-20 · SVG ARCHITECTURAL BLUEPRINT v5.0
       ============================================================ */
    .hero-kmeh {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-items: center;
    }
    @media (min-width: 1024px) {
      .hero-kmeh {
        grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
        gap: 2.5rem;
        min-height: calc(100vh - 100px);
      }
    }

    .hero-text { position: relative; z-index: 2; }

    .hero-pyramid {
      position: relative;
      width: 100%;
      min-width: 280px;
      min-height: 66vh;
      height: 66vh;
      z-index: 1;
    }
    @media (min-width: 1024px) {
      .hero-pyramid { min-height: 82vh; height: 82vh; }
    }
    @media (min-width: 1440px) {
      .hero-pyramid { min-height: 86vh; height: 86vh; }
    }

    .hero-pyramid::before {
      content: '';
      position: absolute;
      inset: -8%;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 255, 163, 0.12) 0%,
        rgba(232, 200, 106, 0.06) 40%,
        transparent 70%
      );
      pointer-events: none;
      z-index: 0;
      animation: heroHaloPulse 8s ease-in-out infinite;
    }
    @keyframes heroHaloPulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%      { opacity: 0.9; transform: scale(1.04); }
    }

    .pyramid-svg-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }
    .pyramid-svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: block;
      overflow: visible;
      pointer-events: auto;
      cursor: grab;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.5));
      animation: pyramidFloat 8s ease-in-out infinite;
    }
    .pyramid-svg:active { cursor: grabbing; }
    body.kmeh-auto-off .pyramid-svg { animation: none; }
    @keyframes pyramidFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    /* ============================================================
       SVG LAYERS · Vue Modulaire Éclatée
       ============================================================ */
    .kmeh-layer {
      transition: transform 0.9s cubic-bezier(0.34, 1.26, 0.64, 1), filter 0.35s ease-out;
      transform-origin: 400px 620px;
      cursor: pointer;
      will-change: transform;
    }
    .kmeh-layer:hover .face-left,
    .kmeh-layer:hover .face-right {
      filter: brightness(1.2) saturate(1.15);
    }
    .kmeh-layer.is-active .face-left,
    .kmeh-layer.is-active .face-right {
      filter: brightness(1.35) saturate(1.3) drop-shadow(0 0 18px rgba(0, 255, 163, 0.55));
    }

    body.kmeh-exploded .kmeh-layer--2 { transform: translateY(-70px); }
    body.kmeh-exploded .kmeh-layer--3 { transform: translateY(-145px); }
    body.kmeh-exploded .kmeh-layer--4 { transform: translateY(-220px); }

    /* Lignes d'explosion entre niveaux */
    .kmeh-explosion-line {
      opacity: 0;
      transition: opacity 0.7s ease-out 0.15s;
      pointer-events: none;
    }
    body.kmeh-exploded .kmeh-explosion-line { opacity: 1; }

    /* Kemet Loop core (visible in exploded mode) */
    .kmeh-core {
      opacity: 0;
      transition: opacity 0.65s ease-out 0.3s;
      pointer-events: none;
    }
    body.kmeh-exploded .kmeh-core { opacity: 1; }

    .kmeh-core-particle {
      animation: coreRise 3.6s ease-in infinite;
      transform-origin: center;
    }
    .kmeh-core-particle--1 { animation-delay: 0s; }
    .kmeh-core-particle--2 { animation-delay: 0.45s; }
    .kmeh-core-particle--3 { animation-delay: 0.9s; }
    .kmeh-core-particle--4 { animation-delay: 1.35s; }
    .kmeh-core-particle--5 { animation-delay: 1.8s; }
    .kmeh-core-particle--6 { animation-delay: 2.25s; }
    .kmeh-core-particle--7 { animation-delay: 2.7s; }
    .kmeh-core-particle--8 { animation-delay: 3.15s; }

    @keyframes coreRise {
      0%   { transform: translateY(0);       opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translateY(-300px);  opacity: 0; }
    }

    /* Œil d'Horus */
    .kmeh-horus-eye {
      animation: horusGlow 3s ease-in-out infinite;
      transform-origin: 400px 260px;
    }
    @keyframes horusGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(232, 200, 106, 0.7)); }
      50%      { filter: drop-shadow(0 0 22px rgba(232, 200, 106, 1)); }
    }
    .kmeh-horus-orbit {
      animation: horusOrbitSpin 14s linear infinite;
      transform-origin: 400px 260px;
    }
    .kmeh-horus-orbit-rev {
      animation: horusOrbitSpinRev 9s linear infinite;
      transform-origin: 400px 260px;
    }
    @keyframes horusOrbitSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes horusOrbitSpinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

    /* Contrôles flottants */
    .pyramid-controls {
      position: absolute;
      bottom: 0.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex; flex-wrap: wrap;
      gap: 0.5rem; justify-content: center;
      z-index: 5; pointer-events: auto;
      max-width: calc(100% - 1rem);
    }
    .pyramid-controls .btn {
      font-size: 0.62rem;
      padding: 0.55rem 0.9rem;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .pyramid-hint {
      position: absolute;
      top: 0.5rem;
      left: 50%;
      transform: translateX(-50%);
      font: 700 9px 'JetBrains Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(241,245,249,0.55);
      background: rgba(9,13,16,0.7);
      border: 1px solid rgba(0,255,163,0.25);
      padding: 5px 11px;
      border-radius: 999px;
      pointer-events: none;
      animation: pyramidHintPulse 3s ease-in-out infinite;
      white-space: nowrap;
      z-index: 4;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    @keyframes pyramidHintPulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.95; }
    }

    /* Level cards */
    .level-card {
      position: relative;
      cursor: pointer;
      padding: 1rem;
      border-radius: 1rem;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
      display: block;
      width: 100%;
    }
    .level-card:hover { border-color: rgba(0,255,163,0.5); background: rgba(0,255,163,0.06); }
    .level-card.active {
      border-color: #00FFA3 !important;
      background: rgba(0,255,163,0.12) !important;
      box-shadow: 0 0 24px -6px rgba(0,255,163,0.35);
      transform: translateY(-2px);
    }
    .level-card.active .level-dot { box-shadow: 0 0 12px currentColor; }
    .level-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; margin-right: 6px; vertical-align: middle;
      transition: box-shadow 0.3s;
    }

    /* Skid cards */
    .skid-card {
      position: relative;
      padding: 1rem;
      border-radius: 1rem;
      background: linear-gradient(160deg, rgba(15, 22, 28, 0.92), rgba(9, 13, 16, 0.98));
      border: 1px solid rgba(0, 255, 163, 0.18);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .skid-card:hover {
      border-color: rgba(0, 255, 163, 0.55);
      transform: translateY(-3px);
      box-shadow: 0 18px 40px -15px rgba(0, 255, 163, 0.25);
    }
    .skid-code {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.55rem;
      border-radius: 0.35rem;
      background: rgba(0, 255, 163, 0.12);
      color: #00FFA3;
      border: 1px solid rgba(0, 255, 163, 0.35);
    }
    .skid-code.au {
      background: rgba(232, 200, 106, 0.12);
      color: #E8C86A;
      border-color: rgba(232, 200, 106, 0.4);
    }

    /* Manifeste rows */
    .manifest-row {
      display: grid; grid-template-columns: 1fr;
      gap: 0.75rem; padding: 1rem; border-radius: 1rem;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.3s;
    }
    @media (min-width: 768px) {
      .manifest-row { grid-template-columns: 1.2fr 1fr 1fr; gap: 1.5rem; align-items: center; }
    }
    .manifest-row:hover { border-color: rgba(0,255,163,0.4); background: rgba(0,255,163,0.04); }

    .impact-card {
      position: relative; padding: 1.5rem; border-radius: 1.25rem;
      background: linear-gradient(165deg, rgba(19,25,32,0.88), rgba(9,13,16,0.96));
      border: 1px solid rgba(197,160,89,0.35);
      overflow: hidden; transition: all 0.35s;
    }
    .impact-card::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(0,255,163,0.06) 0%, transparent 60%);
      opacity: 0; transition: opacity 0.4s; pointer-events: none;
    }
    .impact-card:hover { transform: translateY(-3px); border-color: rgba(0,255,163,0.55); }
    .impact-card:hover::before { opacity: 1; }

    .ompic-badge {
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, rgba(197,160,89,0.15), rgba(232,200,106,0.08));
      border: 1px solid rgba(232,200,106,0.45);
    }
    .ompic-badge::after {
      content: ''; position: absolute; top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent 30%, rgba(232,200,106,0.15) 50%, transparent 70%);
      animation: ompicShimmer 4s linear infinite; pointer-events: none;
    }
    @keyframes ompicShimmer {
      0% { transform: translate(-100%, -100%) rotate(45deg); }
      100% { transform: translate(100%, 100%) rotate(45deg); }
    }

    /* Easter eggs */
    body.ee-turbo { animation: eeTurboHue 8s linear infinite; }
    @keyframes eeTurboHue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
    body.ee-turbo .glass-panel { border-color: rgba(255, 100, 200, 0.6) !important; box-shadow: 0 0 45px -8px rgba(255, 100, 200, 0.4) !important; }
    body.ee-pharaonic { background: radial-gradient(circle at 50% 50%, rgba(232, 200, 106, 0.15), transparent 70%) !important; }
    body.ee-pharaonic .font-kemetTitle { text-shadow: 0 0 20px rgba(232, 200, 106, 0.6); }
    body.ee-kemet::after {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9998;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(232, 200, 106, 0.15) 0%, transparent 25%),
        radial-gradient(circle at 90% 80%, rgba(0, 255, 163, 0.12) 0%, transparent 25%);
      animation: kemetPulse 6s ease-in-out infinite;
    }
    @keyframes kemetPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
    #hieroglyphOverlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 9997;
      display: none; font-family: 'Cinzel', serif;
      color: rgba(232, 200, 106, 0.15);
      font-size: 48px; line-height: 1.2; overflow: hidden; padding: 2rem;
      text-shadow: 0 0 20px rgba(232, 200, 106, 0.3);
    }
    #hieroglyphOverlay.active { display: block; }
    #hieroglyphOverlay .glyph-row {
      display: flex; justify-content: space-around; margin-bottom: 1rem;
      animation: glyphFloat 8s ease-in-out infinite;
    }
    #hieroglyphOverlay .glyph-row:nth-child(2) { animation-delay: 1s; }
    #hieroglyphOverlay .glyph-row:nth-child(3) { animation-delay: 2s; }
    #hieroglyphOverlay .glyph-row:nth-child(4) { animation-delay: 3s; }
    @keyframes glyphFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    .ee-toast {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: linear-gradient(135deg, rgba(232, 200, 106, 0.95), rgba(197, 160, 89, 0.95));
      color: #1a1405; padding: 1.5rem 2.5rem; border-radius: 1rem;
      font: 800 14px 'JetBrains Mono', monospace;
      letter-spacing: 0.05em; text-transform: uppercase;
      z-index: 10000; box-shadow: 0 20px 60px rgba(232, 200, 106, 0.5);
      animation: eeToastIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      text-align: center; pointer-events: none; max-width: 90vw;
    }
    @keyframes eeToastIn {
