<!DOCTYPE html>
<html lang="fr" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">

    <script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script src="assets/qr-generator.js" defer></script>
    <style>
        html { background-color: #060A0D !important; }
        body { background-color: #060A0D !important; }
        .toasts { bottom: 1rem !important; }
        main, header { position: relative; z-index: 10; }

        /* Orbites du logo d'en-tête */
        @keyframes orbitSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes orbitRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
        @keyframes pupilPulse { 0%, 100% { r: 6.8; opacity: 1; } 50% { r: 8.6; opacity: .82; } }
        .anim-orbit { animation: orbitSpin 16s linear infinite; transform-origin: 60px 60px; }
        .anim-counter-orbit { animation: orbitRev 11s linear infinite; transform-origin: 60px 60px; }
        .anim-pupil { animation: pupilPulse 2.4s ease-in-out infinite; }

        @media (prefers-reduced-motion: reduce) {
          .anim-orbit, .anim-counter-orbit, .anim-pupil { animation: none; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden text-slate-100 font-sans">

    <!-- ═══════════════ HEADER DE DIRECTION ═══════════════ -->
    <header class="bg-obsidianCard/95 backdrop-blur border-b border-kemetGold/30 sticky top-0 z-40 shadow-lg" style="padding-top:env(safe-area-inset-top)">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
            <a href="index.html" class="flex items-center gap-3 min-w-0 group" aria-label="Industrial Illusion SARL — Accueil">
                <div class="relative w-11 h-11 flex items-center justify-center shrink-0">
                    <svg class="w-full h-full" viewBox="0 0 120 120" fill="none" aria-hidden="true">
                        <g class="anim-orbit">
                            <ellipse cx="60" cy="60" rx="54" ry="54" stroke="#C5A059" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.6"/>
                            <circle cx="60" cy="6" r="2.2" fill="#00FFA3"/>
                            <circle cx="114" cy="60" r="2.2" fill="#00FFA3"/>
                            <circle cx="60" cy="114" r="2.2" fill="#00FFA3"/>
                            <circle cx="6" cy="60" r="2.2" fill="#00FFA3"/>
                        </g>
                        <g class="anim-counter-orbit">
                            <ellipse cx="60" cy="60" rx="45" ry="45" stroke="#00FFA3" stroke-width="0.6" stroke-dasharray="2 5" opacity="0.45"/>
                            <circle cx="60" cy="15" r="1.6" fill="#E8C86A"/>
                            <circle cx="105" cy="60" r="1.6" fill="#E8C86A"/>
                            <circle cx="60" cy="105" r="1.6" fill="#E8C86A"/>
                            <circle cx="15" cy="60" r="1.6" fill="#E8C86A"/>
                        </g>
                        <path d="M20 54 Q32 44 46 42" stroke="#C5A059" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M100 54 Q88 44 74 42" stroke="#C5A059" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M22 60 Q60 38 98 60 Q60 82 22 60 Z" stroke="#00FFA3" stroke-width="2.2" fill="#0A0D10"/>
                        <circle cx="60" cy="60" r="14" stroke="#C5A059" stroke-width="1.8" fill="#11161C"/>
                        <circle cx="60" cy="60" r="7" fill="#00FFA3" class="anim-pupil"/>
                        <path d="M60 74 L58 90" stroke="#00FFA3" stroke-width="1.6" stroke-linecap="round"/>
                        <path d="M60 78 L64 92" stroke="#C5A059" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="min-w-0">
                    <h1 class="font-kemetTitle text-[11px] sm:text-sm font-black tracking-widest leading-none text-white truncate group-hover:text-cyberGreen transition-colors">INDUSTRIAL ILLUSION</h1>
                    <p class="text-[7px] sm:text-[9px] font-mono tracking-[0.2em] sm:tracking-[0.28em] text-cyberGreen font-extrabold uppercase mt-0.5 truncate">CONTROL TOWER · DIRECTION GÉNÉRALE</p>
                </div>
            </a>
            <div class="flex items-center gap-2 shrink-0 font-mono text-xs">
                <a href="pwa.html" class="hidden sm:inline text-[10px] text-cyberGreen hover:underline" title="Ouvrir la workstation opérateurs">App opérateurs →</a>
                <span id="qBadge" class="hidden text-[9px] px-2 py-0.5 rounded bg-kemetGold/20 text-kemetGold border border-kemetGold/40">0</span>
                <span id="netDot" class="dot" role="status" aria-label="État de la connexion réseau"></span>
                <span id="who" class="hidden md:inline text-[10px] text-slate-400 truncate max-w-[180px]" title="Utilisateur connecté">—</span>
                <button type="button" id="out" class="hidden btn sm btn-r">Déconnexion ⎋</button>
            </div>
        </div>
    </header>

    <!-- APPLICATION CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 w-full flex-grow">

        <!-- ═══ Phase 🅲 · Control Tower — Doppia Pesata Atomica ═══ -->

            <header class="variance-tower__head">
                <h2 class="variance-tower__title">
                    Allerte Doppia Pesata
                    <span id="variance-badge" class="variance-badge" hidden>0</span>
                </h2>
                <button id="variance-refresh" type="button" class="variance-btn variance-btn--ghost">
                    Aggiorna
                </button>
            </header>
            <div id="variance-alert-stack" class="variance-stack"></div>
        </section>

        <div id="root"></div>
    </main>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <noscript>

        </div>

    <script src="assets/core.js"></script>
    <script src="assets/admin.js"></script>
    <script src="assets/admin-variance.js" defer></script>
    <script src="assets/admin-mfa.js" defer></script>

</html>
